[project]
name = "sandbox-manager"
version = "0.1.0"
description = "Sandbox 管理服务 Manager（FastAPI + MCP）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = ["integration: 需要真实 Runtime、Docker 与 Execd"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"
